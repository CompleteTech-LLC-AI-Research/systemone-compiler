[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-compiler"
version = "0.1.0"
description = "Declarative Jev programs, DSPy synthesis, GEPA optimization, and a lightweight typed runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
live = ["typesafe-sdk==0.7.0"]
optimize = ["dspy[litellm]==3.3.1", "gepa==0.1.4"]
research = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]
all = ["typesafe-sdk==0.7.0", "dspy[litellm]==3.3.1", "gepa==0.1.4", "pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
s1 = "s1compiler.cli:main"
s1-study = "s1compiler.hierarchy_study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s1compiler = ["templates/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["optional: requires optional installed SDK or optimizer dependencies"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
