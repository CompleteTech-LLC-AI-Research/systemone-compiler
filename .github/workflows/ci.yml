name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q --cov=typewright
      - run: python -m typewright demo --out runs/ci-demo
      - run: python -m build
      - name: Verify wheel modules, starter data, and entry points
        run: python tests/check_wheel_package.py dist/typewright-*.whl
      - name: Verify installed wheel outside checkout without keys
        run: |
          temp_dir="$(mktemp -d)"
          python -m venv "$temp_dir/venv"
          "$temp_dir/venv/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/typewright-*.whl
          cp -R "$GITHUB_WORKSPACE/examples/hierarchy/support" "$temp_dir/study-inputs"
          cd "$temp_dir"
          unset PYTHONPATH
          unset TYPESAFE_API_KEY OPENAI_API_KEY S1_TEACHER_API_KEY
          "$temp_dir/venv/bin/s1" demo --out flat-demo
          "$temp_dir/venv/bin/s1" demo --starter hierarchy --out graph-demo
          "$temp_dir/venv/bin/python" -m typewright.hierarchy_research_data --help
          "$temp_dir/venv/bin/python" -c "import sys, typewright; assert not {'dspy', 'gepa', 'typesafe_sdk'} & set(sys.modules)"
          "$temp_dir/venv/bin/typewright-study" register --study-id installed_wheel_synthetic \
            --source study-inputs/source.json --candidate study-inputs/source.json \
            --flat study-inputs/flat_baseline.s1.json --train study-inputs/train.jsonl \
            --validation study-inputs/validation.jsonl --calibration study-inputs/calibration.jsonl \
            --test study-inputs/test.jsonl --out study-protocol.json
          "$temp_dir/venv/bin/typewright-study" select --protocol study-protocol.json --out study-frozen
          "$temp_dir/venv/bin/typewright-study" test --frozen study-frozen --out study-execution
          "$temp_dir/venv/bin/typewright-study" report --frozen study-frozen --execution study-execution
  optional-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the supported range in pyproject.toml (issue #90).
        dspy: ['3.3.1', '3.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[all,dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m pip install 'dspy[litellm]==${{ matrix.dspy }}' 'gepa==0.1.4'
      - run: python -m typewright doctor --check-optional
      - run: python -m pytest -q
# This workflow never uses API secrets and does not run paid inference.
# Workflow configuration being shipped is not evidence of a remote CI run.
