name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q --cov=s1compiler
      - run: python -m s1compiler demo --out runs/ci-demo
      - run: python -m build
  optional-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[all,dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m s1compiler doctor --check-optional
      - run: python -m pytest -q
# This workflow never uses API secrets and does not run paid inference.
# Workflow configuration being shipped is not evidence of a remote CI run.
