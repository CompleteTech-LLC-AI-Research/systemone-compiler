name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q --cov=s1compiler
      - run: python -m s1compiler demo --out runs/ci-demo
      - run: python -m build
      - name: Verify installed wheel outside checkout without keys
        run: |
          temp_dir="$(mktemp -d)"
          python -m venv "$temp_dir/venv"
          "$temp_dir/venv/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/systemone_compiler-*.whl
          cd "$temp_dir"
          unset TYPESAFE_API_KEY OPENAI_API_KEY S1_TEACHER_API_KEY
          "$temp_dir/venv/bin/s1" demo --out flat-demo
          "$temp_dir/venv/bin/s1" demo --starter hierarchy --out graph-demo
          "$temp_dir/venv/bin/python" -m s1compiler.hierarchy_research_data --help
          "$temp_dir/venv/bin/python" -c "import sys, s1compiler; assert not {'dspy', 'gepa', 'typesafe_sdk'} & set(sys.modules)"
  optional-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[all,dev]'
      - run: python -m pip install -r examples/ai-gateway/requirements.txt
      - run: python -m s1compiler doctor --check-optional
      - run: python -m pytest -q
# This workflow never uses API secrets and does not run paid inference.
# Workflow configuration being shipped is not evidence of a remote CI run.
